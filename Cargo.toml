[package]
name = "silent-chrome"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
secpref-kit = { git = "https://github.com/shxve/secpref-kit", rev = "53b0980a9b3d80719d6af973eb30c90f33074c57" }
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "fat"
strip = "symbols"
panic = "abort"
opt-level = "z"
codegen-units = 1
